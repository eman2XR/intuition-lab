<!doctype html>
<html><head><meta charset="utf-8"><title>Intuition Lab film renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="engine.js"></script><script src="holography.js"></script>
<script>
// Driven by lab/film.py: setup() once with the guide's chapter timing, then frame(t) for each frame.
let engine=null, project=null;
window.setup=async(chapters,w,h)=>{
 engine=new CouncilFilm.Engine(document.getElementById('c'),{width:w,height:h});
 await engine.texture('albedo','assets/earth/albedo.png',{repeatX:true});
 await engine.texture('masks','assets/earth/masks.png',{srgb:false,repeatX:true});
 await engine.texture('relief','assets/earth/relief.png',{srgb:false,repeatX:true});
 project=HolographyFilm.build(chapters,{aspect:w/h});
 return project.duration;
};
window.frame=(t,samples,quality=.93)=>{engine.render(project,t,{samples});return engine.canvas.toDataURL('image/jpeg',quality);};
window.poster=(samples=8)=>{engine.render(project.posterProject,3,{samples});return engine.canvas.toDataURL('image/jpeg',.95);};
window.captions=t=>project.captions(t);
</script></body></html>
